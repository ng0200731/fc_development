<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FC — Internal Tool</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="workspace-startup" class="workspace-overlay" role="dialog" aria-modal="true" aria-labelledby="workspace-startup-title">
    <div class="workspace-dialog">
      <div class="workspace-kicker">FC WORKSPACE</div>
      <h1 id="workspace-startup-title">Choose a workspace</h1>
      <p>Select the data workspace to use for this session. You can switch later from the workspace control.</p>
      <div class="workspace-choice-grid">
        <button class="workspace-choice" type="button" data-workspace-choice="FC"><strong>FC</strong><span>Production workspace</span></button>
        <button class="workspace-choice" type="button" data-workspace-choice="TEST"><strong>TEST</strong><span>Testing workspace</span></button>
      </div>
    </div>
  </div>

  <div class="layout">
    <!-- LEFT MENU — 10% -->
    <nav class="sidebar" id="sidebar" aria-label="Sidebar">
      <div class="group" data-group="customer">
        <button class="group-toggle" aria-expanded="true">
          <span class="caret">▾</span> Customer
        </button>
        <ul class="group-items">
          <li><a class="nav-item" data-target="customer-create" href="#">Create</a></li>
          <li><a class="nav-item" data-target="customer-view" href="#">View</a></li>
        </ul>
      </div>

      <div class="group" data-group="development">
        <button class="group-toggle" aria-expanded="true">
          <span class="caret">▾</span> Development
        </button>
        <ul class="group-items">
          <li><a class="nav-item" data-target="development-create" href="#">Create</a></li>
          <li><a class="nav-item" data-target="development-view" href="#">View</a></li>
        </ul>
      </div>

      <div class="group" data-group="enquiry">
        <button class="group-toggle" aria-expanded="true">
          <span class="caret">▾</span> Enquiry
        </button>
        <ul class="group-items">
          <li><a class="nav-item" data-target="enquiry-create" href="#">Create</a></li>
          <li><a class="nav-item" data-target="enquiry-view" href="#">View</a></li>
        </ul>
      </div>

      <div class="group" data-group="setting">
        <button class="group-toggle" aria-expanded="true">
          <span class="caret">▾</span> Settings
        </button>
        <ul class="group-items">
          <li><a class="nav-item" data-target="setting-options" href="#">Options</a></li>
        </ul>
      </div>
    </nav>

    <!-- RIGHT MENU — 90% -->
    <main class="content" aria-label="Content">
      <div class="workspace-bar" id="workspace-bar">
        <span class="workspace-label">Workspace</span>
        <strong id="workspace-current">—</strong>
        <button class="btn tiny" id="workspace-switch" type="button">Switch</button>
      </div>
      <div class="tabs" id="tabs" role="tablist"><!-- mini tabs injected here --></div>
      <section class="panel" id="panel">
        <p class="empty">Select an item from the left menu.</p>
      </section>
    </main>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
